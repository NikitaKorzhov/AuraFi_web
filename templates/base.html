<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }} — {{ project_name }}</title>
    {% load static %}
    <script>
        /* Must run before first paint to avoid a light->dark flash; kept
           inline for that reason, everything else lives in static files. */
        (function () {
            try {
                var saved = localStorage.getItem("aurafi-theme");
                var theme = saved || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", theme);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a class="brand" href="{% url 'core:home' %}">💰 AuraFi</a>
            <nav class="main">
                <a href="{% url 'core:home' %}" class="{% if request.resolver_match.app_name == 'core' and request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                <a href="{% url 'transactions:home' %}" class="{% if request.resolver_match.app_name == 'transactions' %}active{% endif %}">Tracker</a>
                <a href="{% url 'core:about' %}" class="{% if request.resolver_match.app_name == 'core' and request.resolver_match.url_name == 'about' %}active{% endif %}">About</a>
            </nav>
            <div class="navbar-right">
                <button id="theme-toggle" type="button" aria-label="Toggle theme">🌙 Dark mode</button>
            </div>
        </div>
    </header>

    <main>
        <h1>{{ title }}</h1>
        {% block subnav %}{% endblock %}
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <p>&copy; 2026 AuraFi</p>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
