{% extends "base.html" %}

{% block content %}
    {% if budgets %}
        <ul>
            {% for budget in budgets %}
                <li>
                    {{ budget.category }}: {{ budget.monthly_limit }} грн/місяць
                    (<a href="{% url 'transactions:transactions_by_category' budget.category %}">транзакції</a>)
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Немає бюджетів.</p>
    {% endif %}

    <p><a href="{% url 'transactions:home' %}">Назад на головну</a></p>
{% endblock %}
